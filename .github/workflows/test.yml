name: test

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        # Linux reads process environments from /proc, macOS from `ps eww`;
        # both paths need covering.
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m unittest discover -s tests -v
      - name: package builds and the entry point runs
        run: |
          python -m pip install --upgrade pip build
          python -m build
          python -m pip install dist/*.whl
          panemap --help
